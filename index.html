<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chota Dukan</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eef1f6;--card:#fff;--card2:#f8fafc;--text:#0f172a;--muted:#64748b;
  --primary:#4f46e5;--primary2:#7c3aed;--success:#16a34a;--danger:#dc2626;
  --warning:#f59e0b;--info:#0891b2;--border:#e2e8f0;--radius:18px;
  --shadow:0 2px 12px rgba(15,23,42,.07);--shadow-lg:0 10px 30px rgba(15,23,42,.14);
}
[data-theme="dark"]{--bg:#0b1220;--card:#151f33;--card2:#1b2740;--text:#e2e8f0;--muted:#94a3b8;--border:#243044;--shadow:0 2px 12px rgba(0,0,0,.35);--shadow-lg:0 10px 30px rgba(0,0,0,.5)}
html[dir="rtl"] body{font-family:'Noto Nastaliq Urdu','Segoe UI',Tahoma,sans-serif}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;padding-bottom:calc(78px + env(safe-area-inset-bottom));transition:background .25s,color .25s;overflow-x:hidden}
::-webkit-scrollbar{width:0;height:0}
.topbar{position:sticky;top:0;z-index:150;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 4px 18px rgba(79,70,229,.28)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.15rem}
.brand i{font-size:1.35rem;color:#fbbf24}
.topbar .icon-btn{background:rgba(255,255,255,.16);border:none;color:#fff;width:38px;height:38px;border-radius:12px;font-size:.85rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;transition:.2s;margin-left:6px}
.topbar .icon-btn:active{transform:scale(.9);background:rgba(255,255,255,.3)}
.wrap{padding:14px 14px 20px;max-width:760px;margin:0 auto}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.page-head h4{margin:0;font-weight:800;font-size:1.25rem;flex:1}
.back-btn{width:40px;height:40px;border-radius:13px;border:none;background:var(--card);color:var(--text);box-shadow:var(--shadow);font-size:1rem;display:inline-flex;align-items:center;justify-content:center}
.back-btn:active{transform:scale(.92)}
.card-x{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px 12px;box-shadow:var(--shadow);border:1px solid var(--border);text-align:center;position:relative;overflow:hidden;height:100%;cursor:pointer;transition:.15s}
.stat:active{transform:scale(.97)}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,#ccc)}
html[dir="rtl"] .stat::before{left:auto;right:0}
.stat .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:1.15rem;color:#fff;background:var(--c,#ccc)}
.stat .num{font-size:1.4rem;font-weight:800;color:var(--c);line-height:1.15;word-break:break-word}
.stat .lbl{font-size:.74rem;color:var(--muted);font-weight:600;margin-top:2px}
.stat .view-all{position:absolute;bottom:6px;right:8px;font-size:.68rem;font-weight:800;color:var(--c);opacity:.85}
html[dir="rtl"] .stat .view-all{right:auto;left:8px}
.btn-x{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:none;border-radius:15px;padding:14px;font-weight:700;font-size:1rem;color:#fff;transition:.15s;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.btn-x:active{transform:scale(.97);filter:brightness(.95)}
.btn-x i{font-size:1.15rem}
.bg-p{background:linear-gradient(135deg,var(--primary),var(--primary2))}
.bg-s{background:linear-gradient(135deg,#16a34a,#22c55e)}
.bg-d{background:linear-gradient(135deg,#dc2626,#ef4444)}
.bg-w{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.bg-i{background:linear-gradient(135deg,#0891b2,#06b6d4)}
.bg-g{background:linear-gradient(135deg,#475569,#64748b)}
.btn-soft{background:var(--card2);color:var(--text);border:1px solid var(--border);box-shadow:none;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:30px;background:var(--card2);border:1px solid var(--border);color:var(--muted);font-size:.82rem;font-weight:700;white-space:nowrap}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.form-label{font-weight:700;font-size:.85rem;color:var(--muted);margin-bottom:5px}
.form-control,.form-select{background:var(--card2);border:1.5px solid var(--border);color:var(--text);border-radius:13px;padding:11px 13px;font-size:1rem;font-weight:600}
.form-control:focus,.form-select:focus{background:var(--card2);color:var(--text);border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.form-control::placeholder{color:var(--muted);font-weight:500;opacity:.7}
.input-icon{position:relative}
.input-icon i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.95rem}
html[dir="rtl"] .input-icon i{right:auto;left:14px}
.voice{background:var(--info);color:#fff;border:none;width:30px;height:30px;border-radius:50%;font-size:.8rem;display:inline-flex;align-items:center;justify-content:center;margin-left:6px}
.scan-btn{background:var(--warning);color:#fff;border:none;width:40px;height:40px;border-radius:12px;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.scan-btn:active{transform:scale(.9)}
.prod{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);height:100%;display:flex;flex-direction:column;transition:.18s}
.prod:active{transform:scale(.975)}
.prod .img{height:120px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:2rem;position:relative}
.prod .img img{width:100%;height:100%;object-fit:cover}
.prod .body{padding:10px 11px;flex:1;display:flex;flex-direction:column}
.prod h6{font-weight:800;font-size:.92rem;margin:0 0 4px;line-height:1.25}
.prod .price{font-weight:800;color:var(--success);font-size:1rem}
.prod .qty{position:absolute;top:7px;right:7px;font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:20px;color:#fff;background:var(--success)}
html[dir="rtl"] .prod .qty{right:auto;left:7px}
.prod .qty.low{background:var(--danger)}
.prod .qty.mid{background:var(--warning)}
.li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:15px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow);border:1px solid var(--border)}
.li:active{transform:scale(.985)}
.li .av{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;color:#fff;flex-shrink:0}
.li .info{flex:1;min-width:0}
.li .info b{display:block;font-weight:700;font-size:.97rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .info small{color:var(--muted);font-size:.78rem}
.li .amt{font-weight:800;font-size:.95rem;white-space:nowrap}
.cart-row{display:flex;align-items:center;gap:9px;padding:10px;border-radius:13px;background:var(--card2);border:1px solid var(--border);margin-bottom:8px}
.qty-btn{width:32px;height:32px;border-radius:9px;border:none;background:var(--card);color:var(--text);font-weight:800;font-size:.95rem;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.qty-btn.plus{background:var(--success);color:#fff;border-color:var(--success)}
.qty-btn.minus{background:var(--danger);color:#fff;border-color:var(--danger)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:200;display:flex;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 24px rgba(15,23,42,.1)}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 2px 8px;color:var(--muted);text-decoration:none;font-size:.68rem;font-weight:700;position:relative;transition:.18s}
.bottomnav a i{font-size:1.2rem;transition:.18s}
.bottomnav a.active{color:var(--primary)}
.bottomnav a.active i{transform:translateY(-2px) scale(1.08)}
.bottomnav a.fab i{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.35rem;margin-top:-26px;box-shadow:0 8px 22px rgba(22,163,74,.45);border:4px solid var(--card)}
.backdrop{position:fixed;inset:0;background:rgba(2,6,23,.6);z-index:400;opacity:0;pointer-events:none;transition:opacity .28s;backdrop-filter:blur(2px)}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:401;background:var(--card);border-radius:26px 26px 0 0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(110%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-bottom:env(safe-area-inset-bottom);box-shadow:var(--shadow-lg)}
.sheet.open{transform:translateY(0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.sheet-head h5{margin:0;font-weight:800;font-size:1.05rem}
.sheet-head button{width:34px;height:34px;border-radius:11px;border:none;background:var(--card2);color:var(--text);font-size:.95rem}
.sheet-body{overflow-y:auto;padding:14px 16px 20px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-body.no-pad{padding:0}
.grab{width:44px;height:4px;border-radius:4px;background:var(--border);margin:8px auto 0}
#toastBox{position:fixed;top:calc(74px + env(safe-area-inset-top));left:12px;right:12px;z-index:900;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.toast-x{background:var(--card);color:var(--text);padding:12px 18px;border-radius:14px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow-lg);border-left:5px solid var(--success);display:flex;align-items:center;gap:10px;max-width:100%;animation:slideDown .3s}
.toast-x.danger{border-left-color:var(--danger)}
.toast-x.warning{border-left-color:var(--warning)}
.toast-x.info{border-left-color:var(--info)}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
.badge-x{font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:20px;display:inline-block}
.b-green{background:color-mix(in srgb,#16a34a 15%,transparent);color:#16a34a}
.b-red{background:color-mix(in srgb,#dc2626 15%,transparent);color:#dc2626}
.b-amber{background:color-mix(in srgb,#f59e0b 20%,transparent);color:#b45309}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty i{font-size:3.2rem;opacity:.28;margin-bottom:14px;display:block}
.row-total{display:flex;justify-content:space-between;padding:7px 0;font-weight:600;font-size:.95rem}
.row-total.big{font-size:1.2rem;font-weight:800;border-top:2px dashed var(--border);padding-top:12px;margin-top:6px}
.alert-x{border-radius:15px;padding:13px 15px;font-weight:700;font-size:.87rem;display:flex;gap:11px;align-items:flex-start;border:1px solid}
.alert-warn{background:color-mix(in srgb,#f59e0b 12%,transparent);border-color:color-mix(in srgb,#f59e0b 35%,transparent);color:#b45309}
.alert-danger{background:color-mix(in srgb,#dc2626 12%,transparent);border-color:color-mix(in srgb,#dc2626 35%,transparent);color:#dc2626}
.alert-info{background:color-mix(in srgb,#0891b2 12%,transparent);border-color:color-mix(in srgb,#0891b2 35%,transparent);color:#0891b2}
.alert-success{background:color-mix(in srgb,#16a34a 12%,transparent);border-color:color-mix(in srgb,#16a34a 35%,transparent);color:#16a34a}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.scroll-x::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:700;padding:9px;border-radius:10px;font-size:.85rem}
.seg button.active{background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(79,70,229,.35)}
.receipt{background:#fff;color:#111;border-radius:14px;padding:18px;font-family:'Courier New',monospace;font-size:.85rem}
.receipt h5{text-align:center;font-weight:800;margin:0 0 2px}
.receipt .r-line{display:flex;justify-content:space-between;padding:3px 0}
.receipt hr{border:none;border-top:1px dashed #999;margin:9px 0}
.lang-menu{display:flex;flex-direction:column;gap:8px;padding:4px}
.lang-menu button{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;border:2px solid var(--border);background:var(--card2);color:var(--text);font-weight:700;font-size:1rem;text-align:left;transition:.15s}
.lang-menu button.active{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.lang-menu button:active{transform:scale(.98)}
.lang-menu .flag{font-size:1.6rem}
.cat-card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:10px;cursor:pointer;transition:.15s}
.cat-card:active{transform:scale(.985)}
.cat-card .cat-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cat-card .cat-ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#fff;flex-shrink:0}
.cat-card .cat-name{font-weight:800;font-size:1.05rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-card .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.cat-card .cat-grid > div{background:var(--card2);border-radius:11px;padding:8px 4px}
.cat-card .cat-grid .cv{font-weight:800;font-size:.95rem;line-height:1.1}
.cat-card .cat-grid .cl{font-size:.62rem;color:var(--muted);font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
.dead-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:15px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow);border:1px solid var(--border);border-left:4px solid var(--danger)}
.dead-row.warn{border-left-color:var(--warning)}
.dead-row .dead-days{background:var(--danger);color:#fff;font-weight:800;font-size:.7rem;padding:4px 10px;border-radius:20px;text-align:center;line-height:1.1}
.dead-row.warn .dead-days{background:var(--warning)}
/* ===== SCANNER ===== */
.scanner-box{position:relative;background:#000;min-height:280px;border-radius:14px;overflow:hidden}
.scanner-box video{border-radius:14px!important;width:100%!important;height:auto!important;object-fit:cover!important}
#qrReader{width:100%!important;min-height:280px}
#qrReader img{display:none!important}
#qrReader__dashboard_section_csr{display:none!important}
#qrReader__dashboard_section_fsr{display:none!important}
#qrReader__header_message{display:none!important}
#qrReader__status_span{display:none!important}
#qrReader__scan_region{background:transparent!important}
#qrReader__scan_region img{display:none!important}
.scan-line{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--warning),transparent);animation:scanline 2s linear infinite;z-index:10;pointer-events:none}
@keyframes scanline{0%{top:10%}50%{top:90%}100%{top:10%}}
.scan-corner{position:absolute;width:24px;height:24px;border:3px solid #22c55e;z-index:5;pointer-events:none}
.scan-corner.tl{top:15%;left:8%;border-right:none;border-bottom:none;border-radius:4px 0 0 0}
.scan-corner.tr{top:15%;right:8%;border-left:none;border-bottom:none;border-radius:0 4px 0 0}
.scan-corner.bl{bottom:15%;left:8%;border-right:none;border-top:none;border-radius:0 0 0 4px}
.scan-corner.br{bottom:15%;right:8%;border-left:none;border-top:none;border-radius:0 0 4px 0}
.scan-ctrl-btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:30px;background:var(--card2);border:1.5px solid var(--border);color:var(--text);font-size:.78rem;font-weight:800;transition:.15s;cursor:pointer}
.scan-ctrl-btn:active{transform:scale(.94);background:var(--primary);color:#fff;border-color:var(--primary)}
.scan-ctrl-btn.on{background:var(--warning);border-color:var(--warning);color:#fff}
.size-opt-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 16px;margin-bottom:8px;border-radius:14px;border:2px solid;font-weight:800;font-size:.95rem;transition:.15s;cursor:pointer}
.size-opt-btn:active{transform:scale(.97)}
.size-opt-btn.sale{background:color-mix(in srgb,#16a34a 10%,transparent);border-color:color-mix(in srgb,#16a34a 40%,transparent);color:#16a34a}
.size-opt-btn.buy{background:color-mix(in srgb,#4f46e5 10%,transparent);border-color:color-mix(in srgb,#4f46e5 40%,transparent);color:#4f46e5}
.size-opt-btn.disabled{background:var(--card2);border-color:var(--border);color:var(--muted);opacity:.5;cursor:not-allowed}
[data-theme="dark"] .size-opt-btn.sale{color:#22c55e}
[data-theme="dark"] .size-opt-btn.buy{color:#a5b4fc}
@media print{body *{visibility:hidden}#sheet,#sheet *{visibility:visible}#sheet{position:absolute;top:0;left:0;right:0;max-height:none;transform:none;border-radius:0}.sheet-head,.no-print{display:none!important}.backdrop{display:none}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand" onclick="go('dashboard')"><i class="fas fa-store"></i> <span id="brandName">Chota Dukan</span></div>
  <div style="display:flex;align-items:center">
    <button class="icon-btn" onclick="openLangMenu()" id="langBtn" title="Language">RU</button>
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn"><i class="fas fa-moon"></i></button>
    <button class="icon-btn" onclick="go('settings')"><i class="fas fa-cog"></i></button>
  </div>
</header>

<main id="main"></main>

<nav class="bottomnav">
  <a href="javascript:void(0)" onclick="go('dashboard')" data-nav="dashboard"><i class="fas fa-home"></i><span data-t="home">Home</span></a>
  <a href="javascript:void(0)" onclick="go('products')" data-nav="products"><i class="fas fa-boxes-stacked"></i><span data-t="stock">Stock</span></a>
  <a href="javascript:void(0)" onclick="startSale()" data-nav="sale_form" class="fab"><i class="fas fa-cart-plus"></i><span data-t="sell">Bech</span></a>
  <a href="javascript:void(0)" onclick="go('udhar')" data-nav="udhar"><i class="fas fa-hand-holding-dollar"></i><span data-t="udhar">Udhar</span></a>
  <a href="javascript:void(0)" onclick="go('ledger')" data-nav="ledger"><i class="fas fa-book"></i><span data-t="ledger">Hisab</span></a>
</nav>

<div class="backdrop" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div id="toastBox"></div>

<script>
/* ============================================================
   LANGUAGE SYSTEM
============================================================ */
let LANG = localStorage.getItem('cd_lang') || 'ru';

const STR = {
  ru: {
    home:'Home', stock:'Stock', sell:'Bech', buy:'Khareed', ledger:'Hisab', udhar:'Udhar',
    todays_calc:'Aaj ka Hisab', todays_sale:'AAJ KI BIKRI', recv:'Lena Hai', pay:'Dena Hai',
    stock_val:'Stock Value', todays_exp:'Aaj ka Kharcha', view_all:'Sab Dekhein',
    received:'Paisa Liya', paid:'Paisa Diya', exp:'Kharcha', recent_sales:'Recent Bikri',
    low_stock:'Stock khatam ho raha hai!', profit:'Munafa', sales_count:'bikri',
    greeting_morning:'Assalam-o-Alaikum', greeting_afternoon:'Good Afternoon', greeting_evening:'Good Evening',
    customer:'Customer', supplier:'Supplier', products:'Products', customers:'Customers',
    suppliers:'Suppliers', sales:'Bikriyan', purchases:'Khareedari', expenses:'Kharcha',
    payments:'Payments', items:'Items',
    add:'Add', save:'Save', cancel:'Cancel', delete:'Delete', edit:'Edit', update:'Update',
    yes:'Haan', no:'Nahi', ok:'Theek Hai', full:'Pura', call:'Call', view:'Dekhein',
    name:'Naam', phone:'Phone', address:'Address', amount:'Amount', date:'Date', notes:'Notes',
    category:'Category', quantity:'Quantity', min_stock:'Min Stock', photo:'Photo (optional)',
    khareed_price:'Khareed', bikri_price:'Bikri', opening_balance:'Opening Balance',

const DB = {
  get(k,d=[]){ try{ const v=localStorage.getItem('cd_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('cd_'+k, JSON.stringify(v)); }catch(e){ toast(t('t_storage_full'), 'danger'); } },
  nextId(k){ const a=DB.get(k); return a.reduce((m,x)=>Math.max(m,x.id||0),0)+1; },
  calcBalance(type, id){
    const key = type==='customer' ? 'customers' : 'suppliers';
    const p = DB.get(key).find(x=>x.id===id);
    if(!p) return 0;
    const opening = +p.opening_balance || 0;
    let bal = opening;
    if(type==='customer'){
      DB.get('sales').filter(s=>s.customer_id===id).forEach(s=>{ bal += (+s.remaining||0); });
      DB.get('payments').filter(x=>x.type==='customer'&&x.party_id===id).forEach(x=>{ bal -= (+x.amount||0); });
    } else {
      DB.get('purchases').filter(s=>s.supplier_id===id).forEach(s=>{ bal += (+s.remaining||0); });
      DB.get('payments').filter(x=>x.type==='supplier'&&x.party_id===id).forEach(x=>{ bal -= (+x.amount||0); });
    }
    return Math.max(0, bal);
  },
  recalcAll(){
    const customers = DB.get('customers');
    customers.forEach(c => { c.balance = DB.calcBalance('customer', c.id); });
    DB.set('customers', customers);
    const suppliers = DB.get('suppliers');
    suppliers.forEach(s => { s.balance = DB.calcBalance('supplier', s.id); });
    DB.set('suppliers', suppliers);
  },
  usage(){ return new Blob([JSON.stringify(localStorage)]).size; }
};

const fmt = n => 'Rs ' + Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:2});
const fmtN = n => Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:2});
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = s => (s||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const avatarColor = s => { const c=['#4f46e5','#0891b2','#16a34a','#f59e0b','#dc2626','#7c3aed','#db2777','#0d9488']; let h=0; for(const ch of String(s||'')) h=(h*31+ch.charCodeAt(0))%997; return c[h%c.length]; };
const dateFmt = d => { if(!d) return ''; return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); };
const shortDate = d => {
  if(!d) return '';
  const dt=new Date(d+'T00:00:00'); const t2=new Date(); t2.setHours(0,0,0,0);
  const diff=Math.round((t2-dt)/86400000);
  if(diff===0) return t('today');
  if(diff===1) return t('yesterday');
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
};
function daysSince(d){
  if(!d) return Infinity;
  const dt = new Date(d + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.floor((now - dt) / 86400000);
}
function recalcBoxes(p){
  const ppb = +p.pieces_per_box || 0;
  if(ppb >= 1 && (+p.quantity||0) >= 0){
    p.boxes = Math.floor((+p.quantity||0) / ppb);
  }
}
function boxDisplayText(p){
  const ppb = +p.pieces_per_box || 0;
  const qty = +p.quantity || 0;
  if(ppb <= 1 || qty <= 0) return '';
  const fullBoxes = Math.floor(qty / ppb);
  const rem = qty % ppb;
  const boxWord = t('box');
  let s = `<i class="fas fa-box"></i> ${fullBoxes} ${boxWord}`;
  if(rem > 0) s += ` + ${rem} ${t('pcs')}`;
  s += ` (${qty} ${t('pcs')})`;
  return s;
}
function unitDisplay(p){
  const u = p.unit || 'piece';
  if(u === 'piece') return '';
  const icons = {kg:'⚖️', gram:'⚖️', liter:'🧴', ml:'🧴'};
  const labels = {kg:'kg', gram:'g', liter:'L', ml:'ml'};
  return ` ${icons[u]||''}${labels[u]||u}`;
}
function unitBadge(p){
  const u = (p && p.unit) || 'piece';
  const map = {
    piece: {icon:'🔢', label: LANG==='ur' ? 'عدد' : (LANG==='ru' ? 'Pcs' : 'Piece'), color:'#64748b'},
    kg:    {icon:'⚖️', label:'Kg',    color:'#0891b2'},

    liter: {icon:'🧴', label:'Liter', color:'#7c3aed'},
    ml:    {icon:'🧴', label:'ml',    color:'#7c3aed'}
  };
  const m = map[u] || map.piece;

}
function getLastSold(productId){
  const sales = DB.get('sales');
  let last = null;
  sales.forEach(s => {
    if((s.items||[]).some(it => it.product_id === productId)){
      if(!last || s.sale_date > last) last = s.sale_date;
    }
  });
  return last;
}
function getTotalSold(productId){
  let qty = 0;
  DB.get('sales').forEach(s => {
    (s.items||[]).forEach(it => {
      if(it.product_id === productId) qty += +it.quantity || 0;
    });
  });
  return qty;
}
function getCategoryStats(){
  const products = DB.get('products');
  const map = {};
  products.forEach(p => {
    const cat = (p.category || '').trim() || '—';
    if(!map[cat]) map[cat] = { name: cat, count: 0, qty: 0, withPhoto: 0, stockValue: 0, saleValue: 0, profit: 0, items: [] };
    const c = map[cat];
    c.count++;
    c.qty += +p.quantity || 0;
    if(p.photo) c.withPhoto++;
    c.stockValue += (+p.quantity||0) * (+p.purchase_price||0);
    c.saleValue += (+p.quantity||0) * (+p.sale_price||0);
    c.profit += (+p.quantity||0) * ((+p.sale_price||0) - (+p.purchase_price||0));
    c.items.push(p);
  });
  return Object.values(map).sort((a,b)=> b.stockValue - a.stockValue);
}
function getDeadStock(minDays = 30){
  const products = DB.get('products');
  return products.map(p => {
    const last = getLastSold(p.id);
    const days = last ? daysSince(last) : Infinity;
    return { ...p, last_sold: last, days_idle: days, total_sold: getTotalSold(p.id), stockValue: (+p.quantity||0)*(+p.purchase_price||0) };
  }).filter(p => {
    if((+p.quantity||0) <= 0) return false;
    return p.days_idle >= minDays;
  }).sort((a,b) => (b.days_idle === Infinity ? 99999 : b.days_idle) - (a.days_idle === Infinity ? 99999 : a.days_idle));
}
function getMonthPL(monthStr){
  const sales = DB.get('sales').filter(s => (s.sale_date||'').slice(0,7) === monthStr);
  const expenses = DB.get('expenses').filter(e => (e.expense_date||'').slice(0,7) === monthStr);
  const purchases = DB.get('purchases').filter(p => (p.purchase_date||'').slice(0,7) === monthStr);
  const totSale = sales.reduce((a,s)=>a+(+s.total_amount||0),0);
  const totProfit = sales.reduce((a,s)=>a+(+s.profit||0),0);
  const totExp = expenses.reduce((a,e)=>a+(+e.amount||0),0);
  const totPur = purchases.reduce((a,p)=>a+(+p.total_amount||0),0);
  const netProfit = totProfit - totExp;
  return { totSale, totProfit, totExp, totPur, netProfit, salesCount: sales.length };
}
function getMonthlySummary(monthStr){
  const sales = DB.get('sales').filter(s => (s.sale_date||'').slice(0,7) === monthStr);
  const purchases = DB.get('purchases').filter(p => (p.purchase_date||'').slice(0,7) === monthStr);
  const expenses = DB.get('expenses').filter(e => (e.expense_date||'').slice(0,7) === monthStr);
  const totSale = sales.reduce((a,s)=>a+(+s.total_amount||0),0);
  const totProfit = sales.reduce((a,s)=>a+(+s.profit||0),0);
  const totPur = purchases.reduce((a,p)=>a+(+p.total_amount||0),0);
  const totExp = expenses.reduce((a,e)=>a+(+e.amount||0),0);
  const udharGiven = sales.reduce((a,s)=>a+(+s.remaining||0),0);
  const udharTaken = purchases.reduce((a,p)=>a+(+p.remaining||0),0);
  const netProfit = totProfit - totExp;
  return { totSale, totProfit, totPur, totExp, udharGiven, udharTaken, netProfit, salesCount: sales.length };
}
function monthLabel(m){
  const [y, mo] = m.split('-');
  const dt = new Date(parseInt(y), parseInt(mo)-1, 1);
  const locale = LANG === 'ur' ? 'ur-PK' : 'en-GB';

}
function shiftMonth(m, delta){
  const [y, mo] = m.split('-').map(Number);
  const d = new Date(y, mo-1+delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

async function startScannerCamera(){
  if(!scannerStarting) return;
  if(!document.getElementById('qrReader')){ scannerStarting = false; return; }
  if(scannerInstance){ scannerStarting = false; return; }

  const setStatus = (html) => {
    const st = document.getElementById('scanStatus');
    if(st) st.innerHTML = html;
  };

  // HTTPS check
  const isSecure = (location.protocol === 'https:') || (location.hostname === 'localhost') || (location.hostname === '127.0.0.1');
  if(!isSecure){
    setStatus(`<span style="color:var(--danger);font-weight:700"><i class="fas fa-lock"></i> HTTPS zaroori hai</span><br>
      <span style="font-size:.78rem;font-weight:600;color:var(--muted)">Camera sirf HTTPS ya localhost par chalta hai. Aap abhi <b>${location.protocol}//</b> se khol rahe ho. Manually barcode likh sakte ho.</span>`);
    scannerStarting = false;
    return;
  }

  try {
    // Step 1: Kameras list karo - isse permission prompt trigger hoti hai
    let cameras = [];
    try {
      cameras = await Html5Qrcode.getCameras();
    } catch(permErr){
      scannerStarting = false;
      const name = (permErr && permErr.name) || '';
      const msg = (permErr && permErr.message) || String(permErr);
      let hint = 'Browser settings me camera ki permission dein.';
      if(name === 'NotAllowedError') hint = 'Aapne camera ki permission block ki hai. URL bar me lock icon dabao → Camera → Allow karo.';
      else if(name === 'NotFoundError') hint = 'Is device me koi camera nahi mila.';
      else if(name === 'NotReadableError') hint = 'Camera kisi aur app (WhatsApp, Camera app) ne use kiya hua hai. Wo band karke dobara try karo.';
      setStatus(`<span style="color:var(--danger);font-weight:700"><i class="fas fa-exclamation-triangle"></i> Camera permission issue</span><br>
        <span style="font-size:.78rem;font-weight:600;color:var(--muted)">${esc(msg)}</span><br>
        <span style="font-size:.78rem;font-weight:700;color:var(--warning);display:block;margin-top:6px">${hint}</span>`);
      return;
    }

    if(!cameras || cameras.length === 0){
      scannerStarting = false;
      setStatus(`<span style="color:var(--danger);font-weight:700"><i class="fas fa-video-slash"></i> Koi camera nahi mila</span>`);
      return;
    }

    // Step 2: Back camera prefer karo
    let cameraId = cameras[cameras.length - 1].id;
    for(const cam of cameras){
      const lbl = (cam.label || '').toLowerCase();
      if(lbl.includes('back') || lbl.includes('rear') || lbl.includes('environment')){
        cameraId = cam.id;
        break;
      }
    }

    const html5QrCode = new Html5Qrcode("qrReader", { verbose: false });
    scannerInstance = html5QrCode;
    window._scannerObj = html5QrCode;

    const onScanSuccess = (decodedText) => {
      if(!scannerInstance) return;
      const now = Date.now();
      if(decodedText === scannerLastCode && now - scannerLastTime < 1500) return;
      scannerLastCode = decodedText;
      scannerLastTime = now;

      try{ navigator.vibrate && navigator.vibrate([80,40,80]); }catch(e){}
      setStatus(`<span style="color:var(--success);font-weight:800"><i class="fas fa-check-circle"></i> ${t('barcode_found')}: ${esc(decodedText)}</span>`);

      setTimeout(()=>{
        const cb = scannerCallback;
        closeScanner();
        if(cb) cb(decodedText);
      }, 280);
    };

    const config = {
      fps: 20,
      qrbox: function(vw, vh){
        const min = Math.min(vw, vh);
        return { width: Math.floor(min * 0.85), height: Math.floor(min * 0.55) };
      }
    };

    await html5QrCode.start(cameraId, config, onScanSuccess, () => {});

    scannerStarting = false;
    setStatus(`<i class="fas fa-camera"></i> ${t('scan_hint_strong')}`);
    setupScannerControls();

  } catch(err){
    scannerStarting = false;
    scannerInstance = null;
    window._scannerObj = null;
    const msg = (err && (err.message || err.toString())) || 'Unknown error';
    setStatus(`<span style="color:var(--danger);font-weight:700"><i class="fas fa-exclamation-triangle"></i> Camera start nahi hua</span><br>
      <span style="font-size:.8rem;font-weight:600">${esc(msg)}</span><br>
      <span style="font-size:.78rem;font-weight:600;color:var(--muted);display:block;margin-top:6px">Manually barcode likhein ⬇️</span>`);
  }
}

function setupScannerControls(){
  const inst = window._scannerObj;
  if(!inst) return;
  setTimeout(()=>{
    try{
      if(!inst.getRunningTrackCapabilities) return;
      const caps = inst.getRunningTrackCapabilities();
      if(caps){
        if(caps.torch){
          const tb = document.getElementById('torchBtn');
          if(tb) tb.style.display = 'inline-flex';
        }
        if(caps.zoom && caps.zoom.max > caps.zoom.min){
          const zi = document.getElementById('zoomInBtn');
          const zo = document.getElementById('zoomOutBtn');
          if(zi) zi.style.display = 'inline-flex';
          if(zo) zo.style.display = 'inline-flex';
          if(caps.zoom.step) scannerZoomLevel = caps.zoom.min || 1;
        }
      }
    }catch(e){}
  }, 900);
}

function toggleScannerTorch(){
  const inst = window._scannerObj;
  if(!inst) return;
  scannerTorchOn = !scannerTorchOn;
  try{
    inst.applyVideoConstraints({ advanced: [{ torch: scannerTorchOn }] });
    const tb = document.getElementById('torchBtn');
    if(tb) tb.classList.toggle('on', scannerTorchOn);
  }catch(e){}
}

function zoomScanner(delta){
  const inst = window._scannerObj;
  if(!inst) return;
  try{
    const caps = inst.getRunningTrackCapabilities();
    if(!caps || !caps.zoom) return;
    const min = caps.zoom.min || 1;
    const max = caps.zoom.max || 5;
    const step = caps.zoom.step || 1;
    scannerZoomLevel = Math.max(min, Math.min(max, (scannerZoomLevel || min) + (delta * step)));
    inst.applyVideoConstraints({ advanced: [{ zoom: scannerZoomLevel }] });
  }catch(e){}
}

function submitManualBarcode(){
  const el = document.getElementById('manualBarcode');
  const val = (el?.value || '').trim();
  if(!val) return toast('Barcode likhein', 'warning');
  const cb = scannerCallback;
  closeScanner();
  if(cb) cb(val);
}

function closeScanner(){
  const inst = scannerInstance;
  scannerInstance = null;
  scannerStarting = false;
  window._scannerObj = null;
  scannerCallback = null;
  if(inst){
    try{
      inst.stop().then(()=>{
        try{ inst.clear(); }catch(e){}
        closeSheet();
      }).catch(()=>{
        try{ inst.clear(); }catch(e){}
        closeSheet();
      });
    }catch(e){ closeSheet(); }
  } else {
    closeSheet();
  }
}

function getSizeOptions(unit){
  if(unit === 'kg'){
    return [
      {label:'100 g', mult: 0.1},{label:'250 g', mult: 0.25},{label:'500 g', mult: 0.5},{label:'750 g', mult: 0.75},
      {label:'1 kg', mult: 1},{label:'1.5 kg', mult: 1.5},{label:'2 kg', mult: 2},{label:'3 kg', mult: 3},{label:'5 kg', mult: 5}
    ];
  } else if(unit === 'liter'){
    return [
      {label:'100 ml', mult: 0.1},{label:'250 ml', mult: 0.25},{label:'500 ml', mult: 0.5},{label:'750 ml', mult: 0.75},
      {label:'1 Liter', mult: 1},{label:'1.5 Liter', mult: 1.5},{label:'2 Liter', mult: 2},{label:'3 Liter', mult: 3},{label:'5 Liter', mult: 5}
    ];
  }
  return [];
}

function openSizePicker(pid){
  const p = DB.get('products').find(x=>x.id===pid);
  if(!p) return;
  const unit = p.unit || 'piece';
  if(unit !== 'kg' && unit !== 'liter'){ addToCart(pid, 1); return; }
  const opts = getSizeOptions(unit);
  const isSale = cart.mode === 'sale';
  const basePrice = isSale ? (+p.sale_price||0) : (+p.purchase_price||0);
  const unitLabel = unit === 'kg' ? t('per_kg') : t('per_liter');
  const stockAvailable = +p.quantity || 0;
  const optionsHtml = opts.map(o => {
    const price = basePrice * o.mult;
    const canSell = !isSale || stockAvailable >= o.mult;
    const cls = canSell ? (isSale ? 'sale' : 'buy') : 'disabled';
    return `<button type="button" class="size-opt-btn ${cls}" ${canSell ? `onclick="addSizedToCart(${pid}, ${o.mult}, '${o.label}')"` : 'disabled'}>
      <span>📦 ${o.label}</span><span>${fmt(price)}</span></button>`;
  }).join('');
  openSheet(`
    <div class="grab"></div>
    <div class="sheet-head">
      <h5><i class="fas fa-balance-scale" style="color:var(--primary)"></i> ${esc(p.name)}</h5>
      <button onclick="closeSheet()"><i class="fas fa-times"></i></button>
    </div>
    <div class="sheet-body">
      <div class="alert-x alert-info mb-3" style="font-size:.85rem">
        <i class="fas fa-info-circle"></i>
        <div>${t('base_rate')}: <b>${fmt(basePrice)} ${unitLabel}</b>
        ${isSale ? `<br>${t('available_stock')}: <b>${stockAvailable} ${unit}</b>` : ''}</div>
      </div>
      <b style="font-size:.9rem;display:block;margin-bottom:10px">⚖️ ${t('size_picker_title')}</b>
      ${optionsHtml}
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
        <label class="form-label">${t('custom_amount')} (${unit})</label>
        <div style="display:flex;gap:8px">
          <input type="number" step="0.01" inputmode="decimal" class="form-control" id="customSize" placeholder="${t('custom_hint')}">
          <button type="button" class="back-btn" style="background:var(--success);color:#fff;flex-shrink:0;width:auto;padding:0 16px;font-weight:700" onclick="addCustomSizeToCart(${pid})"><i class="fas fa-plus"></i></button>
        </div>
      </div>
    </div>
  `);
}

function addSizedToCart(pid, mult, sizeLabel){
  const p = DB.get('products').find(x=>x.id===pid);
  if(!p) return;
  const isSale = cart.mode === 'sale';
  const basePrice = isSale ? (+p.sale_price||0) : (+p.purchase_price||0);
  const baseCost = +p.purchase_price || 0;
  const unit = p.unit || 'piece';
  if(isSale && (+p.quantity||0) < mult){
    return toast(t('t_stock_only',{name:p.name,n:p.quantity}),'danger');
  }
  const itemKey = pid + '_sz_' + mult;
  const existing = cart.items.find(i => (i.key||i.product_id) === itemKey);
  if(existing){ existing.qty++; }
  else {
    cart.items.push({
      key: itemKey, product_id: pid, name: p.name, size_mult: mult, size_label: sizeLabel,
      unit: unit, qty: 1, price: basePrice * mult, cost: baseCost * mult,
      stock: +p.quantity || 0, ppb: +p.pieces_per_box || 1
    });
  }
  closeSheet(); renderCart();
  if(isSale) calcSale(); else calcPurchase();
  toast(p.name + ' ' + sizeLabel + ' — ' + t('t_added'));
}

function addCustomSizeToCart(pid){
  const input = document.getElementById('customSize');
  const val = parseFloat(input.value);
  if(!val || val <= 0) return toast('Sahi amount likhein', 'warning');
  const p = DB.get('products').find(x=>x.id===pid);
  if(!p) return;
  const unit = p.unit || 'piece';
  let label = '';
  if(unit === 'kg'){ label = val < 1 ? Math.round(val * 1000) + ' g' : val + ' kg'; }
  else if(unit === 'liter'){ label = val < 1 ? Math.round(val * 1000) + ' ml' : val + ' L'; }
  else { label = val + ' ' + unit; }
  addSizedToCart(pid, val, label);
}

          <i class="fas fa-chevron-right" style="color:var(--muted)"></i>

          <div><div class="cv" style="color:#0891b2">${c.qty}</div><div class="cl">${t('stock_qty')}</div></div>
          <div><div class="cv" style="color:#16a34a">${c.withPhoto}</div><div class="cl">📷</div></div>
          <div><div class="cv" style="color:${c.profit>=0?'#f59e0b':'#dc2626'}">${fmtN(c.profit)}</div><div class="cl">${t('potential_profit')}</div></div>

function openCategory(catName){
  const products = DB.get('products').filter(p => ((p.category||'').trim() || '—') === catName);
  const totalQty = products.reduce((a,p)=>a+(+p.quantity||0),0);
  const stockVal = products.reduce((a,p)=>a+(+p.quantity||0)*(+p.purchase_price||0),0);
  const profit = products.reduce((a,p)=>a+(+p.quantity||0)*((+p.sale_price||0)-(+p.purchase_price||0)),0);
  const rows = products.sort((a,b)=>a.name.localeCompare(b.name)).map(p => {
    const qty = +p.quantity || 0;
    const lastSold = getLastSold(p.id);
    const days = lastSold ? daysSince(lastSold) : null;
    const daysLabel = lastSold ? (days === 0 ? t('today') : days === 1 ? t('yesterday') : `${days} ${t('days')}`) : t('never_sold');
    const daysColor = (!lastSold || (days && days > 30)) ? 'var(--danger)' : (days > 14 ? 'var(--warning)' : 'var(--success)');
    const boxText = boxDisplayText(p);
    const bc = p.barcode ? ` • 🏷️ ${esc(p.barcode)}` : '';
    return `<div class="li" style="cursor:pointer" onclick="closeSheet();editProduct(${p.id})">
      <div class="av" style="background:${p.photo ? avatarColor(p.name) : 'var(--muted)'};overflow:hidden;padding:0">
        ${p.photo ? `<img src="${p.photo}" style="width:100%;height:100%;object-fit:cover">` : `<i class="fas fa-image"></i>`}
      </div>
      <div class="info">
        <b style="display:flex;align-items:center;gap:6px">
          <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span>
          ${unitBadge(p)}
        </b>
        <small><i class="fas fa-cubes"></i> ${qty}${boxText ? ' • '+boxText : ''}${bc} • ${t('last_sold')}: <span style="color:${daysColor};font-weight:700">${daysLabel}</span></small>
      </div>
      <div style="text-align:right">
        <div class="amt" style="color:var(--success)">${fmt(p.sale_price)}</div>
        <small style="font-size:.68rem;color:var(--muted)">${fmtN((+p.sale_price||0)-(+p.purchase_price||0))} profit</small>
      </div>
    </div>`;
  }).join('');
  openSheet(`
    <div class="grab"></div>
    <div class="sheet-head">
      <h5><i class="fas fa-layer-group" style="color:var(--primary)"></i> ${esc(catName)}</h5>
      <button onclick="closeSheet()"><i class="fas fa-times"></i></button>
    </div>
    <div class="sheet-body">
      <div class="row g-2 mb-3">
        <div class="col-6"><div class="stat" style="--c:#4f46e5;cursor:default"><div class="num">${products.length}</div><div class="lbl">${t('category_items')}</div></div></div>
        <div class="col-6"><div class="stat" style="--c:#0891b2;cursor:default"><div class="num">${totalQty}</div><div class="lbl">${t('stock_qty')}</div></div></div>
        <div class="col-6"><div class="stat" style="--c:#f59e0b;cursor:default"><div class="num">${fmt(stockVal)}</div><div class="lbl">${t('stock_val')}</div></div></div>
        <div class="col-6"><div class="stat" style="--c:#16a34a;cursor:default"><div class="num">${fmt(profit)}</div><div class="lbl">${t('potential_profit')}</div></div></div>
      </div>
      <b style="font-size:.9rem;display:block;margin-bottom:8px">${t('products')} (${products.length})</b>
      ${products.length ? rows : `<div class="empty"><i class="fas fa-box-open"></i><p>${t('no_data')}</p></div>`}
    </div>
  `);
}

/* ============================================================
   PAGE: DEAD STOCK
============================================================ */
let deadSort = 'days';
function renderDeadStock(){
  let list = getDeadStock(30);
  if(deadSort === 'value') list.sort((a,b)=>b.stockValue - a.stockValue);
  else if(deadSort === 'qty') list.sort((a,b)=>(+b.quantity||0) - (+a.quantity||0));
  const totalValue = list.reduce((a,p)=>a+p.stockValue,0);
  const neverSold = list.filter(p=>!p.last_sold).length;
  const avgDays = (() => {
    const valid = list.filter(p=>p.last_sold);
    if(!valid.length) return 0;
    return Math.round(valid.reduce((a,p)=>a+p.days_idle,0)/valid.length);
  })();
  let html = `<div class="wrap">
    <div class="page-head">
      <button class="back-btn" onclick="go('dashboard')"><i class="fas fa-arrow-left"></i></button>
      <h4><i class="fas fa-skull-crossbones" style="color:var(--danger)"></i> ${t('dead_stock')}</h4>
      <button class="back-btn" onclick="go('products')"><i class="fas fa-boxes-stacked"></i></button>
    </div>
    <div class="alert-x alert-danger mb-3">
      <i class="fas fa-triangle-exclamation"></i>
      <div style="font-size:.82rem"><b>${t('dead_stock_desc')}</b><br><span style="font-weight:600">${t('dead_stock_msg',{n:list.length})}</span></div>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-6"><div class="stat" style="--c:#dc2626;cursor:default"><div class="ico"><i class="fas fa-box-open"></i></div><div class="num">${list.length}</div><div class="lbl">${t('dead_stock')}</div></div></div>
      <div class="col-6"><div class="stat" style="--c:#f59e0b;cursor:default"><div class="ico"><i class="fas fa-coins"></i></div><div class="num">${fmt(totalValue)}</div><div class="lbl">${t('stock_val')}</div></div></div>
      <div class="col-6"><div class="stat" style="--c:#7c3aed;cursor:default"><div class="ico"><i class="fas fa-calendar-xmark"></i></div><div class="num">${avgDays}</div><div class="lbl">${t('avg_days')}</div></div></div>
      <div class="col-6"><div class="stat" style="--c:#0891b2;cursor:default"><div class="ico"><i class="fas fa-circle-question"></i></div><div class="num">${neverSold}</div><div class="lbl">${t('never_sold')}</div></div></div>
    </div>
    <div class="seg mb-3">
      <button class="${deadSort==='days'?'active':''}" onclick="deadSort='days';go('dead_stock')">${t('by_days')}</button>
      <button class="${deadSort==='value'?'active':''}" onclick="deadSort='value';go('dead_stock')">${t('by_value')}</button>
      <button class="${deadSort==='qty'?'active':''}" onclick="deadSort='qty';go('dead_stock')">${t('by_qty')}</button>
    </div>`;
  if(!list.length){
    html += `<div class="empty"><i class="fas fa-check-circle" style="color:var(--success)"></i><p>${t('no_dead_stock')}</p></div>`;
  } else {
    list.slice(0, 200).forEach(p => {
      const qty = +p.quantity || 0;
      const days = p.days_idle === Infinity ? null : p.days_idle;
      const rowClass = (days === null || days > 45) ? '' : 'warn';
      const daysText = days === null ? '∞' : days;
      const isNever = !p.last_sold;
      html+=`<div class="dead-row ${rowClass}" onclick="editProduct(${p.id})">
        <div style="width:44px;height:44px;border-radius:13px;background:${p.photo?avatarColor(p.name):'var(--muted)'};overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff">
          ${p.photo ? `<img src="${p.photo}" style="width:100%;height:100%;object-fit:cover">` : `<i class="fas fa-image"></i>`}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:6px">
            <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span>
            ${unitBadge(p)}
          </div>
          <div style="font-size:.72rem;color:var(--muted);font-weight:600;margin-top:2px">
            ${isNever ? `<span style="color:var(--danger)"><i class="fas fa-ban"></i> ${t('never_sold')}</span>` : `<i class="fas fa-clock-rotate-left"></i> ${t('last_sold')}: ${shortDate(p.last_sold)}`} • <i class="fas fa-cubes"></i> ${qty}
          </div>
          <div style="font-size:.72rem;color:var(--muted);margin-top:2px">
            <i class="fas fa-coins"></i> ${fmt(p.stockValue)} • ${t('potential_profit')}: ${fmtN(qty*((+p.sale_price||0)-(+p.purchase_price||0)))}
          </div>
        </div>
        <div class="dead-days">${daysText}<br><span style="font-size:.65rem;font-weight:600">${t('days')}</span></div>
      </div>`;
    });
  }
  html += `</div>`;
  return html;
}

let udharTab='customer';

  const customers=DB.get('customers').filter(c=>(+c.balance||0)>0).sort((a,b)=>b.balance-a.balance);
  const suppliers=DB.get('suppliers').filter(s=>(+s.balance||0)>0).sort((a,b)=>b.balance-a.balance);
  const list = isC ? customers : suppliers;
  const total = list.reduce((a,x)=>a+(+x.balance||0),0);
  let html=`<div class="wrap">
    <div class="page-head">
      <button class="back-btn" onclick="go('dashboard')"><i class="fas fa-arrow-left"></i></button>

    <div class="seg mb-3">
      <button class="${isC?'active':''}" onclick="udharTab='customer';go('udhar')">${t('udhar_customers')} (${customers.length})</button>
      <button class="${!isC?'active':''}" onclick="udharTab='supplier';go('udhar')">${t('udhar_suppliers')} (${suppliers.length})</button>
    </div>
    <div class="stat mb-3" style="--c:${isC?'#16a34a':'#dc2626'};cursor:default">
      <div class="num">${fmt(total)}</div><div class="lbl">${isC?t('recv'):t('pay')}</div>
    </div>`;
  if(!list.length){
    html+=`<div class="empty"><i class="fas fa-check-circle" style="color:var(--success)"></i><p>${isC?t('no_receivable'):t('no_payable')}</p></div>`;
  } else {
    list.forEach(p=>{
      html+=`<div class="li" onclick="go('party_detail',{type:'${udharTab}',id:${p.id}})">
        <div class="av" style="background:${avatarColor(p.name)}">${initials(p.name)}</div>
        <div class="info"><b>${esc(p.name)}</b><small>${p.phone?esc(p.phone):(isC?t('customer'):t('supplier'))}</small></div>
        <div style="text-align:right">
          <div class="amt" style="color:${isC?'var(--success)':'var(--danger)'}">${fmt(p.balance)}</div>
          <small style="color:var(--muted);font-size:.7rem">${isC?t('lena_hai'):t('dena_hai')}</small>
        </div>
      </div>`;
    });
  }
  html+=`<div style="height:8px"></div></div>`;
  return html;
}

  const stockValue = products.reduce((a,p)=>a+(+p.quantity||0)*(+p.purchase_price||0),0);
  let html=`<div class="wrap">
    <div class="page-head">
      <h4><i class="fas fa-boxes-stacked" style="color:var(--primary)"></i> ${t('stock')}</h4>

      <div class="col-4"><div class="stat" style="--c:#16a34a;cursor:default"><div class="num" style="font-size:1.2rem">${withPhoto}</div><div class="lbl">📷 ${t('with_photo')}</div></div></div>

    cats.forEach(c=>{
      const n=products.filter(p=>p.category===c).length;
      html+=`<button class="chip ${productFilter.cat===c?'active':''}" onclick="productFilter.cat='${esc(c).replace(/'/g,"\\'")}';renderProductsRefresh()">${esc(c)} (${n})</button>`;
    });
    html+=`</div>`;
  }
  html+=`<div class="row g-2" id="prodGrid"></div></div>`;
  setTimeout(refreshProductList,0);
  return html;
}
function renderProductsRefresh(){ document.getElementById('main').innerHTML=renderProducts(); setTimeout(refreshProductList,0); }
function refreshProductList(){
  const grid=document.getElementById('prodGrid'); if(!grid) return;
  const products=DB.get('products');
  const q=(productFilter.q||'').toLowerCase().trim();
  const cat=productFilter.cat;
  let list=products.filter(p=>{
    const mq=!q||p.name.toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q)||(p.barcode||'').includes(q);
    const mc=!cat||p.category===cat;
    return mq&&mc;
  });
  list.sort((a,b)=>a.name.localeCompare(b.name));
  if(!list.length){
    grid.innerHTML=`<div class="col-12"><div class="empty"><i class="fas fa-box-open"></i><p>${products.length?t('no_match'):t('no_product_yet')}</p>
      ${!products.length?`<button class="btn-x bg-s mt-3" style="max-width:220px;margin:14px auto 0" onclick="editProduct(null)"><i class="fas fa-plus"></i> ${t('add')}</button>`:''}</div></div>`;
    return;
  }
  grid.innerHTML=list.map(p=>{
    const qty=+p.quantity||0, min=+p.min_stock||5;
    const qCls=qty<=0?'low':qty<=min?'mid':'';
    const profit=(+p.sale_price||0)-(+p.purchase_price||0);
    const lastSold = getLastSold(p.id);
    const days = lastSold ? daysSince(lastSold) : null;
    const deadBadge = (days === null || days > 30) && qty > 0;
    const boxText = boxDisplayText(p);
    const boxLine = boxText ? `<div style="font-size:.68rem;color:var(--primary);font-weight:700;margin-bottom:4px">${boxText}</div>` : '';
    return `<div class="col-6 col-md-4"><div class="prod" onclick="editProduct(${p.id})">
      <div class="img">${p.photo?`<img src="${p.photo}">`:`<i class="fas fa-image"></i>`}<span class="qty ${qCls}">${qty}</span>
      ${deadBadge?`<span style="position:absolute;bottom:6px;left:6px;background:var(--danger);color:#fff;font-size:.62rem;font-weight:800;padding:3px 8px;border-radius:10px"><i class="fas fa-skull-crossbones"></i> ${days===null?'∞':days}d</span>`:''}
      </div>
      <div class="body">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <h6 style="flex:1;min-width:0;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</h6>
          ${unitBadge(p)}
        </div>
        ${p.category?`<div style="font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:5px">${esc(p.category)}</div>`:''}
        ${boxLine}
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto">
          <span class="price">${fmt(p.sale_price)}</span>
          ${profit>0?`<span class="badge-x b-green">+${fmtN(profit)}</span>`:''}
        </div></div></div></div>`;
  }).join('');
}
function scanForProductLookup(){

function calcTotalQty(){
  const boxes = parseInt(document.getElementById('f_boxes').value) || 0;
  const ppb = parseInt(document.getElementById('f_ppb').value) || 1;
  if(boxes > 0 && ppb >= 1){ document.getElementById('f_qty').value = boxes * ppb; }
}
function calcBoxes(){
  const qty = parseFloat(document.getElementById('f_qty').value) || 0;
  const ppb = parseInt(document.getElementById('f_ppb').value) || 1;
  if(ppb >= 1 && qty >= 0){ document.getElementById('f_boxes').value = Math.floor(qty / ppb); }
}
let _photoData=null;
function previewImg(e,id){
  const file=e.target.files[0]; if(!file) return;
  if(file.size>900000) toast(t('t_photo_large'), 'warning');
  const r=new FileReader();
  r.onload=ev=>{ _photoData=ev.target.result; const img=document.getElementById(id); img.src=_photoData; document.getElementById('imgPrevWrap').style.display='block'; };
  r.readAsDataURL(file);
}
function saveProduct(e,id){
  e.preventDefault();
  const name=document.getElementById('f_name').value.trim();
  if(!name) return toast(t('t_name_required'), 'danger');
  const products=DB.get('products');
  const barcode = document.getElementById('f_barcode').value.trim();
  if(barcode){
    const dup = products.find(x => x.id !== id && (x.barcode||'') === barcode);
    if(dup){ return toast(`Barcode pehle se "${dup.name}" ke paas hai`, 'danger'); }
  }
  const data={
    name, category:document.getElementById('f_cat').value.trim(),
    unit: document.getElementById('f_unit')?.value || 'piece',
    barcode: barcode,
    purchase_price:parseFloat(document.getElementById('f_pur').value)||0,
    sale_price:parseFloat(document.getElementById('f_sale').value)||0,
    quantity:parseFloat(document.getElementById('f_qty').value)||0,
    min_stock:parseFloat(document.getElementById('f_min').value)||5,
    boxes:parseInt(document.getElementById('f_boxes').value)||0,
    pieces_per_box:parseInt(document.getElementById('f_ppb').value)||1
  };
  recalcBoxes(data);
  if(id){
    const i=products.findIndex(x=>x.id===id);
    if(i>-1){ products[i]={...products[i],...data}; if(_photoData) products[i].photo=_photoData; }
    DB.set('products',products); toast(t('t_updated'), 'info');
  } else {
    products.push({id:DB.nextId('products'),...data,photo:_photoData||''});
    DB.set('products',products); toast(t('t_added'));
  }
  _photoData=null; go('products');
}
function deleteProduct(id){

    toast(t('t_deleted'),'danger'); go('products');
  },{danger:true,title:t('c_delete')});
}

function filterPicker(q){
  q=q.toLowerCase().trim();
  const products=DB.get('products').slice().sort((a,b)=>a.name.localeCompare(b.name));
  const isSale=cart.mode==='sale';

  if(!list.length){ box.innerHTML=`<div class="empty"><i class="fas fa-magnifying-glass"></i><p>${t('no_match')}</p></div>`; return; }
  box.innerHTML=list.map(p=>{
    const qty=+p.quantity||0; const out=isSale&&qty<=0;
    const ppb=+p.pieces_per_box||1;
    const isSized = p.unit === 'kg' || p.unit === 'liter';
    const boxInfo = ppb>1 ? ' • 📦 '+ppb+'/box' : '';
    const bcInfo = p.barcode ? ' • 🏷️ '+esc(p.barcode) : '';
    const clickFn = isSized ? `openSizePicker(${p.id})` : `addToCart(${p.id},1)`;
    return `<div class="li" style="${out?'opacity:.45':''}">
      <div class="av" style="background:${avatarColor(p.name)}" ${out?'':`onclick="${clickFn}"`}>${initials(p.name)}</div>

      ${out?'':(isSized?`<span class="badge-x b-green">⚖️ Size</span>`:(ppb>1?`<button class="chip active" style="padding:6px 10px;font-size:.68rem" onclick="event.stopPropagation();addToCart(${p.id},${ppb})"><i class="fas fa-box"></i> +${t('box')}</button>`:''))}
    </div>`;
  }).join('');
}
function addToCart(pid, count){
  count = count || 1;
  const p=DB.get('products').find(x=>x.id===pid); if(!p) return;
  const isSale=cart.mode==='sale';
  const itemKey = pid + '_n';
  const existing = cart.items.find(i => (i.key||i.product_id) === itemKey);
  if(existing) existing.qty += count;
  else cart.items.push({
    key: itemKey, product_id: pid, name: p.name, qty: count,
    price: isSale ? (+p.sale_price||0) : (+p.purchase_price||0),
    cost: +p.purchase_price||0, stock: +p.quantity||0,
    ppb: +p.pieces_per_box||1, unit: p.unit || 'piece'
  });
  closeSheet(); renderCart();
  if(isSale) calcSale(); else calcPurchase();
  toast(p.name+' — '+t('t_added'));
}
function changeQty(key,delta){
  const it=cart.items.find(i=>(i.key||i.product_id)==key); if(!it) return;
  it.qty+=delta;
  if(it.qty<=0) cart.items=cart.items.filter(i=>(i.key||i.product_id)!=key);
  renderCart(); if(cart.mode==='sale') calcSale(); else calcPurchase();
}
function setPrice(key,val){
  const it=cart.items.find(i=>(i.key||i.product_id)==key); if(!it) return;
  it.price=parseFloat(val)||0;
  if(cart.mode==='sale') calcSale(); else calcPurchase();
}
function removeItem(key){
  cart.items=cart.items.filter(i=>(i.key||i.product_id)!=key);
  renderCart();
  if(cart.mode==='sale') calcSale(); else calcPurchase();
}
function renderCart(){
  const box=document.getElementById('cartItems'); if(!box) return;
  if(!cart.items.length){
    box.innerHTML=`<div class="empty" style="padding:28px 16px"><i class="fas fa-cart-shopping"></i><p>${t('cart_empty')}</p></div>`;
    return;
  }
  box.innerHTML=cart.items.map(i=>{
    const itemKey = i.key || i.product_id;
    let boxHint = '';
    if(i.ppb && i.ppb>1 && !i.size_label){
      const fullBoxes = Math.floor(i.qty / i.ppb);
      const rem = i.qty % i.ppb;
      boxHint = `<div style="font-size:.68rem;color:var(--primary);font-weight:700;margin-top:2px"><i class="fas fa-box"></i> ${fullBoxes} ${t('box')}${rem>0 ? ' + '+rem+' '+t('pcs') : ''}</div>`;
    }
    const sizeTag = i.size_label
      ? `<div style="font-size:.74rem;color:var(--primary);font-weight:800;margin-top:2px"><i class="fas fa-balance-scale"></i> ${i.size_label} × ${i.qty}</div>`
      : '';
    return `
    <div class="cart-row">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:6px">
          <div style="flex:1;min-width:0;font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(i.name)}</div>
          ${unitBadge(i)}
        </div>
        ${sizeTag}
        ${boxHint}
        <div style="display:flex;align-items:center;gap:6px;margin-top:6px">
          <button class="qty-btn minus" onclick="changeQty('${itemKey}',-1)"><i class="fas fa-minus"></i></button>
          <span style="font-weight:800;min-width:28px;text-align:center">${i.qty}</span>
          <button class="qty-btn plus" onclick="changeQty('${itemKey}',1)"><i class="fas fa-plus"></i></button>
          <span style="color:var(--muted);font-size:.75rem">×</span>
          <input type="number" step="0.01" inputmode="decimal" value="${i.price}" onchange="setPrice('${itemKey}',this.value)" style="width:82px;padding:5px 8px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-weight:700;font-size:.82rem">
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-weight:800;color:var(--success);font-size:.95rem">${fmt(i.qty*i.price)}</div>
        <button class="qty-btn" style="margin-top:5px;color:var(--danger)" onclick="removeItem('${itemKey}')"><i class="fas fa-trash"></i></button>
      </div>
    </div>`;
  }).join('');
}
function cartSubtotal(){ return cart.items.reduce((s,i)=>s+i.qty*i.price,0); }

function renderSaleFormRefresh(){ go('sale_form'); }
function fullPay(){ const {total}=saleTotalsCalc(); cart.meta.paid=total; const el=document.getElementById('s_paid'); if(el) el.value=total.toFixed(2); calcSale(); }
function saleTotalsCalc(){
  const sub=cartSubtotal(), disc=+cart.meta.discount||0;
  const total=Math.max(0,sub-disc);
  const profit=cart.items.reduce((s,i)=>s+i.qty*(i.price-i.cost),0)-disc;
  return {sub,disc,total,profit};
}
function calcSale(){
  const box=document.getElementById('saleTotals'); if(!box) return;
  const {sub,disc,total,profit}=saleTotalsCalc();
  const paid=+cart.meta.paid||0, rem=Math.max(0,total-paid);
  box.innerHTML=`<div class="row-total"><span style="color:var(--muted)">${t('subtotal')}</span><span>${fmt(sub)}</span></div>
    ${disc>0?`<div class="row-total"><span style="color:var(--muted)">${t('discount')}</span><span style="color:var(--danger)">− ${fmt(disc)}</span></div>`:''}
    <div class="row-total big"><span>${t('total')}</span><span style="color:var(--success)">${fmt(total)}</span></div>
    <div class="row-total"><span style="color:var(--muted)">${t('paid_amt')}</span><span>${fmt(paid)}</span></div>
    ${rem>0?`<div class="row-total"><span style="color:var(--muted)">${t('remaining')}</span><span style="color:var(--danger);font-weight:800">${fmt(rem)}</span></div>`:''}
    ${profit>0?`<div style="margin-top:8px;text-align:center"><span class="badge-x b-green"><i class="fas fa-arrow-trend-up"></i> ${t('profit')}: ${fmt(profit)}</span></div>`:''}`;
}
function saveSale(){
  if(!cart.items.length) return toast(t('t_add_items_first'),'warning');
  const {total,disc,profit}=saleTotalsCalc();
  const paid=+cart.meta.paid||0;
  if(paid>total+0.01) return toast(t('t_paid_exceeds'),'danger');
  const products=DB.get('products');
  for(const it of cart.items){
    const p=products.find(x=>x.id===it.product_id); if(!p) continue;
    const deductAmt = it.size_mult ? (it.qty * it.size_mult) : it.qty;
    if((+p.quantity||0) < deductAmt) return toast(t('t_stock_only',{name:p.name,n:p.quantity}),'danger');
  }
  const rem=Math.max(0,total-paid);
  const customer_id=cart.meta.customer_id;
  if(rem>0 && !customer_id) return toast(t('t_select_customer'),'warning');
  const sales=DB.get('sales');
  const sale={
    id:DB.nextId('sales'), customer_id:customer_id||null, sale_date:cart.meta.date,
    total_amount:total, discount:disc, paid_amount:paid, remaining:rem,
    sale_type:rem>0?'credit':'cash', profit, notes:cart.meta.notes||'',
    items:cart.items.map(i=>({
      product_id:i.product_id, name:i.name, quantity:i.qty, price:i.price, cost:i.cost,
      size_label:i.size_label||'', size_mult:i.size_mult||null, unit:i.unit||'piece'
    }))
  };
  sales.push(sale); DB.set('sales',sales);
  cart.items.forEach(it=>{
    const p=products.find(x=>x.id===it.product_id);
    if(p){
      const deductAmt = it.size_mult ? (it.qty * it.size_mult) : it.qty;
      p.quantity=Math.max(0,(+p.quantity||0)-deductAmt);
      recalcBoxes(p);
    }
  });
  DB.set('products',products);
  if(customer_id){
    const customers=DB.get('customers');
    const c=customers.find(x=>x.id===+customer_id);
    if(c){ c.balance = DB.calcBalance('customer', +customer_id); DB.set('customers',customers); }
  }
  toast(t('t_sale_saved'));
  const saleId=sale.id;
  cart={mode:'sale',items:[],meta:{customer_id:null,type:'cash',date:today(),discount:0,paid:0,notes:''}};
  go('sales');
  setTimeout(()=>showReceipt(saleId),350);
}

function calcPurchase(){
  const box=document.getElementById('purTotals'); if(!box) return;

function savePurchase(){

    }))
  });

  const products=DB.get('products');

    const p=products.find(x=>x.id===it.product_id);
    if(p){
      const addAmt = it.size_mult ? (it.qty * it.size_mult) : it.qty;
      p.quantity=(+p.quantity||0)+addAmt;
      if(!it.size_mult && it.price>0) p.purchase_price=it.price;
      recalcBoxes(p);
    }
  });

    const c=customers.find(x=>x.id===s.customer_id);

function showReceipt(saleId){
  const s=DB.get('sales').find(x=>x.id===saleId); if(!s) return;
  const c=DB.get('customers').find(x=>x.id===s.customer_id);
  const name=c?c.name:t('cash_customer');
  const shop=localStorage.getItem('cd_shopname')||'Chota Dukan';
  const itemsHtml=(s.items||[]).map(i=>{
    const sizeTxt = i.size_label ? ` (${i.size_label})` : '';
    return `<div class="r-line"><span>${esc(i.name)}${sizeTxt} × ${i.quantity}</span><span>${fmtN(i.price*i.quantity)}</span></div>`;
  }).join('');
  const text=`*${shop}*\n\n${t('customer')}: ${name}\n${t('date')}: ${dateFmt(s.sale_date)}\n\n`+
    (s.items||[]).map(i=>{
      const sizeTxt = i.size_label ? ` (${i.size_label})` : '';
      return `• ${i.name}${sizeTxt} × ${i.quantity} = Rs ${fmtN(i.price*i.quantity)}`;
    }).join('\n')+
    `\n\n${t('subtotal')}: Rs ${fmtN((+s.total_amount||0)+(+s.discount||0))}`+
    (+s.discount>0?`\n${t('discount')}: -Rs ${fmtN(s.discount)}`:'')+
    `\n*${t('total')}: Rs ${fmtN(s.total_amount)}*\n${t('paid_amt')}: Rs ${fmtN(s.paid_amount)}`+
    (+s.remaining>0?`\n*${t('remaining')}: Rs ${fmtN(s.remaining)}*`:'')+
    `\n\n${t('whatsapp_msg')} 🙏`;
  openSheet(`<div class="grab"></div>
    <div class="sheet-head"><h5><i class="fas fa-receipt" style="color:var(--success)"></i> ${t('receipt')}</h5><button onclick="closeSheet()"><i class="fas fa-times"></i></button></div>
    <div class="sheet-body">
      <div class="receipt" id="receiptBox">
        <h5>${esc(shop)}</h5>
        <div style="text-align:center;font-size:.72rem;color:#666">${t('bikri_receipt')}</div>
        <hr>
        <div class="r-line"><span>${t('customer')}</span><span>${esc(name)}</span></div>
        <div class="r-line"><span>${t('date')}</span><span>${dateFmt(s.sale_date)}</span></div>
        <div class="r-line"><span>${t('bill_no')}</span><span>${String(s.id).padStart(5,'0')}</span></div>
        <hr>${itemsHtml}<hr>
        <div class="r-line"><span>${t('subtotal')}</span><span>${fmtN((+s.total_amount||0)+(+s.discount||0))}</span></div>
        ${(+s.discount>0)?`<div class="r-line"><span>${t('discount')}</span><span>− ${fmtN(s.discount)}</span></div>`:''}
        <div class="r-line" style="font-weight:800;font-size:1rem"><span>${t('total').toUpperCase()}</span><span>${fmtN(s.total_amount)}</span></div>
        <div class="r-line"><span>${t('paid_amt')}</span><span>${fmtN(s.paid_amount)}</span></div>
        ${(+s.remaining>0)?`<div class="r-line" style="font-weight:800"><span>${t('remaining').toUpperCase()}</span><span>${fmtN(s.remaining)}</span></div>`:''}
        <hr><div style="text-align:center;font-size:.75rem">${t('thanks')}</div>
      </div>
      <div class="row g-2 mt-3 no-print">
        <div class="col-6"><button class="btn-x bg-s" onclick="shareWhatsApp(${s.id})"><i class="fab fa-whatsapp"></i> ${t('share_wa')}</button></div>
        <div class="col-6"><button class="btn-x bg-i" onclick="window.print()"><i class="fas fa-print"></i> ${t('print')}</button></div>
        <div class="col-12"><button class="btn-x btn-soft" onclick="deleteSale(${s.id})" style="color:var(--danger)"><i class="fas fa-trash"></i> ${t('delete')}</button></div>
      </div>
    </div>`);
  window._receiptText=text;
}
function shareWhatsApp(saleId){
  const s=DB.get('sales').find(x=>x.id===saleId);
  const c=DB.get('customers').find(x=>x.id===s?.customer_id);
  const phone=(c?.phone||'').replace(/\D/g,'');
  const url=phone?`https://wa.me/${phone.length>10?phone:'92'+phone.replace(/^0/,'')}?text=${encodeURIComponent(window._receiptText)}`:`https://wa.me/?text=${encodeURIComponent(window._receiptText)}`;
  window.open(url,'_blank');
}
function deleteSale(id){
  confirmBox(t('c_delete_sale'), ()=>{
    const sales=DB.get('sales');
    const s=sales.find(x=>x.id===id);
    if(s){
      const products=DB.get('products');
      (s.items||[]).forEach(it=>{
        const p=products.find(x=>x.id===it.product_id);
        if(p){
          const addAmt = it.size_mult ? (it.quantity * it.size_mult) : it.quantity;
          p.quantity=(+p.quantity||0)+addAmt;
          recalcBoxes(p);
        }
      });
      DB.set('products',products);
      if(s.customer_id){ const customers=DB.get('customers'); const c=customers.find(x=>x.id===s.customer_id); if(c){ c.balance=DB.calcBalance('customer',s.customer_id); DB.set('customers',customers); } }
    }
    DB.set('sales',sales.filter(x=>x.id!==id));
    closeSheet(); toast(t('t_deleted'),'danger');
    go(currentPage==='sales'?'sales':'dashboard');
  },{danger:true,title:t('c_delete')});
}

function deletePurchase(id){
  confirmBox(t('c_delete_purchase'), ()=>{
    const purchases=DB.get('purchases');
    const p=purchases.find(x=>x.id===id);
    if(p){
      const products=DB.get('products');
      (p.items||[]).forEach(it=>{
        const pr=products.find(x=>x.id===it.product_id);
        if(pr){
          const deductAmt = it.size_mult ? (it.quantity * it.size_mult) : it.quantity;
          pr.quantity=Math.max(0,(+pr.quantity||0)-deductAmt);
          recalcBoxes(pr);
        }
      });
      DB.set('products',products);
      if(p.supplier_id){ const suppliers=DB.get('suppliers'); const s=suppliers.find(x=>x.id===p.supplier_id); if(s){ s.balance=DB.calcBalance('supplier',p.supplier_id); DB.set('suppliers',suppliers); } }
    }
    DB.set('purchases',purchases.filter(x=>x.id!==id));
    closeSheet(); toast(t('t_deleted'),'danger'); go('purchases');
  },{danger:true,title:t('c_delete')});
}

function saveParty(e,type,id){
  e.preventDefault();
  const isC=type==='customer';
  const key=isC?'customers':'suppliers';
  const list=DB.get(key);
  const name=document.getElementById('pt_name').value.trim();
  if(!name) return toast(t('t_name_required'),'danger');
  const data={name,phone:document.getElementById('pt_phone').value.trim(),address:document.getElementById('pt_addr').value.trim()};
  if(id){
    const i=list.findIndex(x=>x.id===id);
    if(i>-1){
      const balEl=document.getElementById('pt_bal');
      list[i]={...list[i],...data,opening_balance:balEl?(parseFloat(balEl.value)||0):(list[i].opening_balance||0)};
      list[i].balance=DB.calcBalance(isC?'customer':'supplier',id);
    }
    toast(t('t_updated'),'info');
  } else {
    list.push({id:DB.nextId(key),...data,balance:0,opening_balance:0,created:today()});
    toast(t('t_added'));
  }
  DB.set(key,list); go('parties');
}

  let entries=[];

      <div class="col-6">

function showPayment(type,preselectedId=null){
  const isC=type==='customer';
  const parties=DB.get(isC?'customers':'suppliers').filter(p=>(+p.balance||0)>0||preselectedId===p.id);
  if(!parties.length) return toast(t('t_no_party'),'info');
  const opts=parties.sort((a,b)=>b.balance-a.balance).map(p=>`<option value="${p.id}" ${preselectedId==p.id?'selected':''}>${esc(p.name)} — ${fmt(p.balance)}</option>`).join('');
  openSheet(`<div class="grab"></div>
    <div class="sheet-head"><h5><i class="fas ${isC?'fa-hand-holding-dollar':'fa-hand-holding-heart'}" style="color:${isC?'var(--success)':'var(--danger)'}"></i> ${isC?t('received'):t('paid')}</h5><button onclick="closeSheet()"><i class="fas fa-times"></i></button></div>
    <div class="sheet-body">
      <div class="mb-3"><label class="form-label">${isC?t('customer'):t('supplier')}</label>
        <select class="form-select" id="pay_party" onchange="updatePartyBalanceHint('${type}')"><option value="">-- ${t('select_party')} --</option>${opts}</select>
        <div id="payHint" style="margin-top:8px;font-size:.82rem;color:var(--muted);font-weight:600"></div>
      </div>
      <div class="mb-3"><label class="form-label">${t('amount')}</label>
        <div style="display:flex;gap:6px">
          <input type="number" step="0.01" inputmode="decimal" class="form-control" id="pay_amt" placeholder="0">
          <button class="back-btn" style="background:var(--warning);color:#fff;flex-shrink:0;width:auto;padding:0 14px;font-size:.8rem;font-weight:700" onclick="fillFullPay('${type}')">${t('pay_full')}</button>
        </div>
      </div>
      <div class="mb-3"><label class="form-label">${t('date')}</label><input type="date" class="form-control" id="pay_date" value="${today()}"></div>
      <div class="mb-3"><label class="form-label">${t('notes')}</label><input class="form-control" id="pay_notes"></div>
      <button class="btn-x ${isC?'bg-w':'bg-d'}" onclick="savePayment('${type}')"><i class="fas fa-floppy-disk"></i> ${t('save')}</button>
    </div>`);
  if(preselectedId) setTimeout(()=>updatePartyBalanceHint(type),100);
  setTimeout(()=>document.getElementById('pay_amt')?.focus(),350);
}
function updatePartyBalanceHint(type){
  const isC=type==='customer';
  const id=parseInt(document.getElementById('pay_party')?.value);
  const hint=document.getElementById('payHint');
  if(!hint) return;
  if(!id){ hint.textContent=''; return; }
  const p=DB.get(isC?'customers':'suppliers').find(x=>x.id===id);
  if(!p) return;
  const bal=DB.calcBalance(isC?'customer':'supplier',id);
  hint.innerHTML=`<i class="fas fa-info-circle"></i> ${t('current_balance')}: <b style="color:var(--primary)">${fmt(bal)}</b>`;
}
function fillFullPay(type){
  const isC=type==='customer';
  const id=parseInt(document.getElementById('pay_party').value);
  if(!id) return toast(t('t_party_required'),'warning');
  const p=DB.get(isC?'customers':'suppliers').find(x=>x.id===id);
  if(p){
    const bal=DB.calcBalance(isC?'customer':'supplier',id);
    document.getElementById('pay_amt').value=bal.toFixed(2);
  }
}
function savePayment(type){
  const isC=type==='customer';
  const key=isC?'customers':'suppliers';
  const id=parseInt(document.getElementById('pay_party').value);
  if(!id) return toast(t('t_select_party'),'warning');
  const amount=parseFloat(document.getElementById('pay_amt').value)||0;
  if(amount<=0) return toast(t('t_amount_invalid'),'warning');
  const p=DB.get(key).find(x=>x.id===id);
  if(!p) return;
  const currentBal=DB.calcBalance(isC?'customer':'supplier',id);
  if(amount>currentBal+0.01){
    return confirmBox(t('t_payment_too_much',{amt:fmt(currentBal)}), ()=>doPayment(type,id,amount,key), {title:t('c_extra_amount')});
  }
  doPayment(type,id,amount,key);
}
function doPayment(type,id,amount,key){
  const isC=type==='customer';
  const payments=DB.get('payments');
  payments.push({id:DB.nextId('payments'),type,party_id:id,amount,payment_date:document.getElementById('pay_date').value||today(),notes:(document.getElementById('pay_notes')?.value||'').trim()});
  DB.set('payments',payments);
  const list=DB.get(key);
  const p=list.find(x=>x.id===id);
  if(p){ p.balance=DB.calcBalance(isC?'customer':'supplier',id); DB.set(key,list); }
  closeSheet();
  toast(t('t_payment_saved'));
  setTimeout(()=>go(currentPage==='ledger'?'ledger':(currentPage==='udhar'?'udhar':currentPage)),150);
}

let reportRange={from:today(),to:today(),quick:'today'};
function setReportQuick(q){
  const d=new Date();
  const iso=x=>new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10);
  if(q==='today'){ reportRange.from=today(); reportRange.to=today(); }
  else if(q==='7d'){ const f=new Date(d); f.setDate(f.getDate()-6); reportRange.from=iso(f); reportRange.to=today(); }
  else if(q==='30d'){ const f=new Date(d); f.setDate(f.getDate()-29); reportRange.from=iso(f); reportRange.to=today(); }
  else if(q==='month'){ reportRange.from=today().slice(0,8)+'01'; reportRange.to=today(); }
  else if(q==='year'){ reportRange.from=today().slice(0,4)+'-01-01'; reportRange.to=today(); }
  reportRange.quick=q; go('reports');
}

function drawChart(){
  const cvs=document.getElementById('reportChart'); if(!cvs||typeof Chart==='undefined') return;
  if(chartRef){ chartRef.destroy(); chartRef=null; }
  const {from,to}=reportRange;
  const sales=DB.get('sales'), purchases=DB.get('purchases');
  const days=[]; const cur=new Date(from+'T00:00:00'); const end=new Date(to+'T00:00:00');
  const diff=Math.round((end-cur)/86400000);
  const step=diff>40?Math.ceil(diff/30):1;
  let i=0;
  while(cur<=end&&i<62){ const ds=new Date(cur.getTime()-cur.getTimezoneOffset()*60000).toISOString().slice(0,10); days.push(ds); cur.setDate(cur.getDate()+step); i++; }
  const labels=days.map(d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'}));
  const saleData=days.map(d=>sales.filter(s=>s.sale_date===d).reduce((a,s)=>a+(+s.total_amount||0),0));
  const purData=days.map(d=>purchases.filter(p=>p.purchase_date===d).reduce((a,p)=>a+(+p.total_amount||0),0));
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const gridColor=isDark?'rgba(148,163,184,.15)':'rgba(100,116,139,.12)';
  const tickColor=isDark?'#94a3b8':'#64748b';
  chartRef=new Chart(cvs.getContext('2d'),{
    type:'bar',
    data:{labels,datasets:[
      {label:t('report_bikri'),data:saleData,backgroundColor:'rgba(22,163,74,.75)',borderRadius:6,maxBarThickness:26},
      {label:t('report_khareed'),data:purData,backgroundColor:'rgba(79,70,229,.7)',borderRadius:6,maxBarThickness:26}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:tickColor,font:{size:11,weight:'600'},boxWidth:12,usePointStyle:true,pointStyle:'circle'}},tooltip:{callbacks:{label:c=>c.dataset.label+': Rs '+Number(c.raw).toLocaleString('en-PK')}}},
      scales:{x:{grid:{display:false},ticks:{color:tickColor,font:{size:9},maxRotation:0,autoSkip:true,maxTicksLimit:8}},y:{beginAtZero:true,grid:{color:gridColor,drawBorder:false},ticks:{color:tickColor,font:{size:10},callback:v=>v>=1000?(v/1000)+'k':v}}}
    }
  });
}
