    </div>
    <div class="card-x">
      <b style="font-size:.95rem;display:block;margin-bottom:6px"><i class="fas fa-upload" style="color:var(--success)"></i> ${t('restore')}</b>
      <p style="font-size:.84rem;color:var(--muted);margin-bottom:12px">${t('restore_desc')}</p>
      <input type="file" accept=".json" class="form-control" id="importFile" onchange="importData(event)">
    </div>
    <div class="card-x" style="border-color:color-mix(in srgb,#dc2626 40%,var(--border))">
      <b style="font-size:.95rem;display:block;margin-bottom:6px;color:var(--danger)"><i class="fas fa-triangle-exclamation"></i> ${t('reset')}</b>
      <p style="font-size:.84rem;color:var(--muted);margin-bottom:12px">${t('reset_desc')}</p>
      <button class="btn-x bg-d" onclick="resetAll()"><i class="fas fa-trash"></i> ${t('reset')}</button>
    </div>
    <div style="text-align:center;padding:22px 0 10px;color:var(--muted);font-size:.78rem">
      <div style="font-weight:800;font-size:.95rem;color:var(--text);margin-bottom:3px"><i class="fas fa-store" style="color:var(--primary)"></i> Chota Dukan</div>
      Version 4.2 • Made with ❤️
    </div>
  </div>`;
}
function recalcAllBoxes(){
  const products = DB.get('products');
  products.forEach(p => recalcBoxes(p));
  DB.set('products', products);
}
function saveShopName(){
  const v=document.getElementById('shopName').value.trim();
  if(!v) return toast(t('t_name_required'),'warning');
  localStorage.setItem('cd_shopname',v);
  toast(t('t_saved'));
}
function exportData(){
  const data={};
  ['products','suppliers','customers','purchases','sales','payments','expenses'].forEach(k=>data[k]=DB.get(k));
  data._shopname=localStorage.getItem('cd_shopname')||'Chota Dukan';
  data._lang=LANG;
  data._exported=new Date().toISOString();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`chota_dukan_backup_${today()}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  localStorage.setItem('cd_last_backup',new Date().toISOString());
  toast(t('t_backup_done'));
}
function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      confirmBox(t('c_restore'), ()=>{
        ['products','suppliers','customers','purchases','sales','payments','expenses'].forEach(k=>{ if(Array.isArray(data[k])) DB.set(k,data[k]); });
        if(data._shopname) localStorage.setItem('cd_shopname',data._shopname);
        recalcAllBoxes();
        DB.recalcAll();
        toast(t('t_restored'));
        setTimeout(()=>go('dashboard'),900);
      },{title:t('restore')});
    }catch(err){ toast(t('t_invalid_file'),'danger'); }
  };
  r.readAsText(file); e.target.value='';
}
function resetAll(){
  confirmBox(t('c_reset'), ()=>{
    confirmBox(t('c_reset_confirm'), ()=>{
      const theme=localStorage.getItem('cd_theme'), lang=localStorage.getItem('cd_lang');
      localStorage.clear();
      if(theme) localStorage.setItem('cd_theme',theme);
      if(lang) localStorage.setItem('cd_lang',lang);
      toast(t('t_reset_done'),'danger');
      setTimeout(()=>location.reload(),900);
    },{danger:true,title:t('c_reset')});
  },{danger:true,title:t('reset')});
}

/* ============================================================
   PAGES MAP
============================================================ */
const pages={
  dashboard:renderDashboard, products:renderProducts, product_form:renderProductForm,
  categories:renderCategories, dead_stock:renderDeadStock, sales:renderSales,
  sale_form:renderSaleForm, purchases:renderPurchases, purchase_form:renderPurchaseForm,
  parties:renderParties, party_form:renderPartyForm, party_detail:renderPartyDetail,
  ledger:renderLedger, udhar:renderUdhar, expenses:renderExpenses,
  reports:renderReports, settings:renderSettings
};

/* ============================================================
   INIT
============================================================ */
recalcAllBoxes();
DB.recalcAll();
applyLang();
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
